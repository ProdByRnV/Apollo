# Apollo build validation.
#
# Validates that the repository configures, builds and passes its tests from a
# clean checkout on every supported desktop platform — the Phase 0 exit
# criterion. Warnings are errors here and only here (Docs/CODING-STANDARDS.md).
#
# This workflow runs once the repository has a remote that hosts GitHub Actions.
# Until then it is the executable specification of the validation strategy: the
# same three commands documented in Docs/BUILD.md.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
            parallel: 4
          - name: macOS (Apple Clang)
            os: macos-latest
            parallel: 3
          # Capped at 2 deliberately. This job compiles the whole of JUCE twice
          # over — once into the plugin, once into the test runner (ADR-0010) —
          # and since Phase 2 those translation units also pull in the GTK and
          # WebKitGTK headers. JUCE's unity builds are individually large, and
          # four of them at once exhausted the runner's memory: every compile was
          # SIGTERMed at the same instant with no diagnostic and the runner
          # reported a shutdown signal. Fewer jobs, less peak memory.
          - name: Linux (GCC)
            os: ubuntu-latest
            parallel: 2

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # JUCE's Linux dependencies. JUCE builds its juceaide helper during
      # configure, and on Linux that links juce_gui_basics, so the X11 and GL
      # headers are required even for a headless console test build.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      # Apollo's interface is React and TypeScript (Phase 7d), so building the
      # plugin means running a bundler. Only the plugin: `apollo_core` and
      # `ApolloTests` have no frontend dependency and the sanitizer job below
      # configures the editor out entirely, so this is the one job kind that
      # needs Node at all.
      #
      # Pinned rather than left to whatever the runner image ships, for the same
      # reason JUCE is pinned: a toolchain that changes under you turns an
      # unrelated push into a red build. The npm cache is keyed on the lock file,
      # so it is reused until the pinned tree changes.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WebUI/package-lock.json

      # The JUCE checkout is the expensive part of a cold configure. Keying on
      # the dependency file means the cache is invalidated exactly when the pin
      # changes.
      - name: Cache JUCE checkout
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMake/ApolloDependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -DAPOLLO_WARNINGS_AS_ERRORS=ON

      # Built target by target rather than all at once: the plugin and the test
      # runner each compile their own copy of the JUCE modules, and running both
      # concurrently doubles peak memory for no wall-clock gain on a runner this
      # small. Tests first, so a broken engine is reported before the slower
      # plugin link.
      - name: Build tests
        run: cmake --build build --config RelWithDebInfo --target ApolloTests --parallel ${{ matrix.parallel }}

      # Apollo_All, not Apollo: juce_add_plugin makes "Apollo" the shared-code
      # library, while the aggregate target is what actually produces the VST3
      # bundle and the standalone binary. Building "Apollo" alone would quietly
      # stop verifying that the plugin links at all.
      - name: Build plugin
        run: cmake --build build --config RelWithDebInfo --target Apollo_All --parallel ${{ matrix.parallel }}

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  sanitizers:
    name: Sanitizers (Linux, Clang)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          extra-packages: clang

      # The sanitizer job exists to run the test suite under ASan/UBSan. That
      # suite is headless and builds with APOLLO_WITH_WEBVIEW=0, so building the
      # WebView editor here would add a large third-party surface that nothing
      # in the run actually exercises.
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAPOLLO_ENABLE_ASAN=ON \
            -DAPOLLO_ENABLE_UBSAN=ON \
            -DAPOLLO_ENABLE_WEBVIEW=OFF

      # Only the test runner: the plugin's cross-platform build is already
      # covered by the matrix above.
      - name: Build
        run: cmake --build build-san --target ApolloTests

      - name: Test
        env:
          # LeakSanitizer is enabled by default alongside ASan on Linux. JUCE
          # allocates static-lifetime singletons and string pools that are never
          # freed by design, so LSan reports them on every run and would keep
          # this job permanently red for no signal. ASan still catches the
          # failures that actually matter in audio code — use-after-free,
          # buffer overruns, stack corruption — and JUCE's own leak detector
          # still catches leaked JUCE objects in Debug builds.
          #
          # Revisit with an LSan suppressions file once Apollo owns real heap
          # resources of its own (wavetables, voice pools) in Phase 3+.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure
