# Apollo build validation.
#
# Validates that the repository configures, builds and passes its tests from a
# clean checkout on every supported desktop platform — the Phase 0 exit
# criterion. Warnings are errors here and only here (Docs/CODING-STANDARDS.md).
#
# This workflow runs once the repository has a remote that hosts GitHub Actions.
# Until then it is the executable specification of the validation strategy: the
# same three commands documented in Docs/BUILD.md.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
            parallel: 4
          # Universal: a macOS release has to run on Apple Silicon and on
          # Intel, and a build on either contains only that one unless it is
          # asked for both (ADR-0077). It is the whole job rather than a second
          # configure, so what is tested and what is packaged are the same
          # binaries; the cost is that the tests are compiled twice over too.
          - name: macOS (Apple Clang)
            os: macos-latest
            parallel: 3
            configure-extra: -DAPOLLO_MACOS_UNIVERSAL=ON
          # Capped at 2 deliberately. This job compiles the whole of JUCE twice
          # over — once into the plugin, once into the test runner (ADR-0010) —
          # and since Phase 2 those translation units also pull in the GTK and
          # WebKitGTK headers. JUCE's unity builds are individually large, and
          # four of them at once exhausted the runner's memory: every compile was
          # SIGTERMed at the same instant with no diagnostic and the runner
          # reported a shutdown signal. Fewer jobs, less peak memory.
          - name: Linux (GCC)
            os: ubuntu-latest
            parallel: 2
          # ARM64 (Phase 11d). Apollo's DSP has no intrinsics in it — ADR-0073
          # and ADR-0074 declined SIMD on the evidence — so portability here is
          # by construction rather than by porting. What this job establishes is
          # that the claim is true: the same 2.3 million assertions, the same
          # fifteen regression renders, and a package of its own.
          - name: Linux ARM64 (GCC)
            os: ubuntu-24.04-arm
            parallel: 2

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # JUCE's Linux dependencies. JUCE builds its juceaide helper during
      # configure, and on Linux that links juce_gui_basics, so the X11 and GL
      # headers are required even for a headless console test build.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      # Apollo's interface is React and TypeScript (Phase 7d), so building the
      # plugin means running a bundler. Only the plugin: `apollo_core` and
      # `ApolloTests` have no frontend dependency and the sanitizer job below
      # configures the editor out entirely, so this is the one job kind that
      # needs Node at all.
      #
      # Pinned rather than left to whatever the runner image ships, for the same
      # reason JUCE is pinned: a toolchain that changes under you turns an
      # unrelated push into a red build. The npm cache is keyed on the lock file,
      # so it is reused until the pinned tree changes.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WebUI/package-lock.json

      # The JUCE checkout is the expensive part of a cold configure. Keying on
      # the dependency file means the cache is invalidated exactly when the pin
      # changes.
      - name: Cache JUCE checkout
        uses: actions/cache@v4
        with:
          path: build/_deps
          # The architecture is part of the key: two Linux jobs now share a
          # runner.os, and a cache holding one of them would be handed to the
          # other.
          key: juce-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMake/ApolloDependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -DAPOLLO_WARNINGS_AS_ERRORS=ON ${{ matrix.configure-extra }}

      # Built target by target rather than all at once: the plugin and the test
      # runner each compile their own copy of the JUCE modules, and running both
      # concurrently doubles peak memory for no wall-clock gain on a runner this
      # small. Tests first, so a broken engine is reported before the slower
      # plugin link.
      - name: Build tests
        run: cmake --build build --config RelWithDebInfo --target ApolloTests --parallel ${{ matrix.parallel }}

      # Apollo_All, not Apollo: juce_add_plugin makes "Apollo" the shared-code
      # library, while the aggregate target is what actually produces the VST3
      # bundle and the standalone binary. Building "Apollo" alone would quietly
      # stop verifying that the plugin links at all.
      - name: Build plugin
        run: cmake --build build --config RelWithDebInfo --target Apollo_All --parallel ${{ matrix.parallel }}

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo -L unit --output-on-failure

      # The host harness (ADR-0075): the VST3 bundle built above, loaded
      # through a VST3 host implementation and driven the way a DAW drives it.
      # After the plugin, because it tests the bundle rather than the sources,
      # and separately, because it compiles a third copy of the JUCE modules it
      # needs and this runner is short of memory (see the matrix above).
      #
      # Verbose, so a run that passed still records what the host saw: the
      # parameter count, the load time, and the per-case measurements.
      - name: Build host harness
        run: cmake --build build --config RelWithDebInfo --target ApolloHostTests --parallel ${{ matrix.parallel }}

      - name: Host tests
        run: ctest --test-dir build -C RelWithDebInfo -L host -V

      # Packaging: 11a on Windows, 11b on macOS, 11c on Linux (ADR-0076,
      # ADR-0077, ADR-0078). The package is staged, and then the host harness is
      # pointed at the *staged* bundle rather than the one in the build tree: a
      # package nobody loaded is a guess, and the install step is exactly where
      # a file can go missing.
      - name: Stage the package
        run: cmake --install build --config RelWithDebInfo --prefix staged

      # macOS refuses to load code it cannot verify, and on Apple Silicon that
      # includes an unsigned binary. Signed ad-hoc, which needs no certificate
      # and is what a build without a Developer ID can produce; a release for
      # distribution needs a Developer ID and notarisation, which need
      # credentials this project does not have (ADR-0077).
      #
      # --force because the linker already applies an ad-hoc signature and
      # installing copies it; re-signing the staged copy is what makes the
      # verification below a statement about the package rather than the build
      # tree.
      - name: Sign the staged package ad-hoc
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - --deep staged/VST3/Apollo.vst3
          codesign --force --sign - --deep staged/Standalone/Apollo.app
          codesign --verify --strict --verbose=2 staged/VST3/Apollo.vst3
          codesign --verify --strict --verbose=2 staged/Standalone/Apollo.app
          codesign --display --verbose=2 staged/VST3/Apollo.vst3

      - name: Test the staged package (Windows)
        if: runner.os == 'Windows'
        run: >
          ./build/Tests/ApolloHostTests_artefacts/RelWithDebInfo/ApolloHostTests.exe
          --plugin staged/VST3/Apollo.vst3

      - name: Test the staged package (macOS and Linux)
        if: runner.os != 'Windows'
        run: >
          ./build/Tests/ApolloHostTests_artefacts/RelWithDebInfo/ApolloHostTests
          --plugin staged/VST3/Apollo.vst3

      # The installation notes are checked against a real Linux system: every
      # library they name must be one the loader can actually find. JUCE opens
      # X11, GTK and WebKitGTK with dlopen rather than linking them, so those
      # names appear nowhere in the binary and nothing else would catch a typo
      # in them (ADR-0078).
      - name: Check the libraries INSTALL.txt names
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          # Written to a file rather than piped into grep. `grep -q` stops at
          # the first match and closes the pipe, which kills the writer with
          # SIGPIPE — and under `pipefail` that failed writer becomes the
          # pipeline's status, so every library that IS installed reports as
          # missing. That is exactly what the first version of this step did.
          ldconfig -p > "$RUNNER_TEMP/ldconfig.txt"

          missing=()

          for soname in $(grep -oE 'lib[A-Za-z0-9._+-]*\.so[0-9.]*' staged/INSTALL.txt | sed 's/\.$//' | sort -u); do
            case "$soname" in
              # The two WebKitGTK generations are alternatives: only one of them
              # is on any given system, so they are checked as a pair below.
              libwebkit2gtk-*|libjavascriptcoregtk-*|libsoup-*) continue ;;
            esac

            if ! grep -Fq "$soname" "$RUNNER_TEMP/ldconfig.txt"; then
              missing+=("$soname")
            fi
          done

          if ! grep -Eq 'libwebkit2gtk-4\.(0|1)\.so' "$RUNNER_TEMP/ldconfig.txt"; then
            missing+=("either WebKitGTK generation")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::INSTALL.txt names a library this system does not have: $name"
            done
            exit 1
          fi

          echo "Every library INSTALL.txt names resolves on this system."

      - name: Build the archive
        working-directory: build
        run: cpack -C RelWithDebInfo -G ZIP

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          # Named for the configuration it is: CI gates on RelWithDebInfo, so
          # these archives are RelWithDebInfo builds and are larger than release
          # ones. They exist to prove the package builds and loads, not to be
          # shipped — a release is cut from Release (Docs/BUILD.md §7).
          # The architecture is in the name for the same reason it is in the
          # cache key: an artefact name has to be unique within a run.
          name: apollo-${{ runner.os }}-${{ runner.arch }}-relwithdebinfo
          path: build/Apollo-*.zip
          if-no-files-found: error

      # The regression renders, verbosely, so their per-case measurements appear
      # in the log of a run that passed. ctest prints a passing test's output
      # only when asked, and this is the one place the cross-platform spread of
      # those figures can be read (Tests/CMakeLists.txt).
      - name: Regression report
        run: ctest --test-dir build -C RelWithDebInfo -R apollo.regression -V

  sanitizers:
    name: Sanitizers (Linux, Clang)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          extra-packages: clang

      # The sanitizer job exists to run the test suite under ASan/UBSan. That
      # suite is headless and builds with APOLLO_WITH_WEBVIEW=0, so building the
      # WebView editor here would add a large third-party surface that nothing
      # in the run actually exercises.
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAPOLLO_ENABLE_ASAN=ON \
            -DAPOLLO_ENABLE_UBSAN=ON \
            -DAPOLLO_ENABLE_WEBVIEW=OFF

      # Only the test runner: the plugin's cross-platform build is already
      # covered by the matrix above.
      - name: Build
        run: cmake --build build-san --target ApolloTests

      - name: Test
        env:
          # LeakSanitizer is enabled by default alongside ASan on Linux. JUCE
          # allocates static-lifetime singletons and string pools that are never
          # freed by design, so LSan reports them on every run and would keep
          # this job permanently red for no signal. ASan still catches the
          # failures that actually matter in audio code — use-after-free,
          # buffer overruns, stack corruption — and JUCE's own leak detector
          # still catches leaked JUCE objects in Debug builds.
          #
          # Revisit with an LSan suppressions file once Apollo owns real heap
          # resources of its own (wavetables, voice pools) in Phase 3+.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san -L unit --output-on-failure
