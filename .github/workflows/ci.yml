# Apollo build validation.
#
# Validates that the repository configures, builds and passes its tests from a
# clean checkout on every supported desktop platform — the Phase 0 exit
# criterion. Warnings are errors here and only here (Docs/CODING-STANDARDS.md).
#
# This workflow runs once the repository has a remote that hosts GitHub Actions.
# Until then it is the executable specification of the validation strategy: the
# same three commands documented in Docs/BUILD.md.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
          - name: macOS (Apple Clang)
            os: macos-latest
          - name: Linux (GCC)
            os: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # JUCE's Linux dependencies. The current test target needs only a subset,
      # but the plugin and standalone targets added in Phase 1 need the full set,
      # so it is installed up front to keep the matrix stable as targets land.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libjack-jackd2-dev \
            libcurl4-openssl-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build

      # The JUCE checkout is the expensive part of a cold configure. Keying on
      # the dependency file means the cache is invalidated exactly when the pin
      # changes.
      - name: Cache JUCE checkout
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMake/ApolloDependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -DAPOLLO_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  sanitizers:
    name: Sanitizers (Linux, Clang)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libcurl4-openssl-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev ninja-build clang

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAPOLLO_ENABLE_ASAN=ON \
            -DAPOLLO_ENABLE_UBSAN=ON

      - name: Build
        run: cmake --build build-san

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure
