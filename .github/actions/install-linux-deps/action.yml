name: Install Apollo Linux build dependencies
description: >
  Installs the system packages JUCE needs to configure and build Apollo on
  Linux. This exists as a composite action rather than as inline steps because
  the list was previously duplicated between the build matrix and the sanitizer
  job, the two copies drifted, and the sanitizer job failed during configure on
  missing X11 headers while the build job passed. One list, one place.

inputs:
  extra-packages:
    description: Additional apt packages to install alongside the base set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update

        # JUCE accepts either WebKitGTK generation:
        #   JUCEUtils.cmake -> _juce_available_pkgconfig_module_or_else(
        #                          webkit_package_name webkit2gtk-4.1 webkit2gtk-4.0)
        # Ubuntu 24.04 ships 4.1, older images ship 4.0, and hard-coding either
        # one makes the whole apt step fail on the image that lacks it. Pick
        # whichever the runner actually offers.
        if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
          webkit_dev=libwebkit2gtk-4.1-dev
        elif apt-cache show libwebkit2gtk-4.0-dev >/dev/null 2>&1; then
          webkit_dev=libwebkit2gtk-4.0-dev
        else
          echo "::error::No WebKitGTK development package is available on this runner."
          exit 1
        fi

        echo "Using WebKitGTK package: ${webkit_dev}"

        sudo apt-get install -y --no-install-recommends \
          libasound2-dev \
          libjack-jackd2-dev \
          libcurl4-openssl-dev \
          libfreetype-dev \
          libfontconfig1-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libglu1-mesa-dev \
          mesa-common-dev \
          libgtk-3-dev \
          "${webkit_dev}" \
          ninja-build \
          ${{ inputs.extra-packages }}

        # JUCE resolves its Linux browser dependencies through pkg-config:
        #   _juce_create_pkgconfig_target(JUCE_BROWSER_LINUX_DEPS NOLINK
        #                                 ${webkit_package_name} gtk+-x11-3.0)
        # That call does NOT pass REQUIRED, so a missing module is not a
        # configure error — it silently produces empty include paths and the
        # build then dies much later on a missing gtk/gtk.h. Verifying here
        # turns that into an immediate, legible failure.
        echo "Verifying pkg-config modules JUCE requires..."
        pkg-config --exists gtk+-x11-3.0 \
          || { echo "::error::pkg-config module gtk+-x11-3.0 not found after install"; exit 1; }
        pkg-config --exists webkit2gtk-4.1 || pkg-config --exists webkit2gtk-4.0 \
          || { echo "::error::no webkit2gtk pkg-config module found after install"; exit 1; }
        echo "pkg-config modules OK"
