name: Install Apollo Linux build dependencies
description: >
  Installs the system packages JUCE needs to configure and build Apollo on
  Linux. This exists as a composite action rather than as inline steps because
  the list was previously duplicated between the build matrix and the sanitizer
  job, the two copies drifted, and the sanitizer job failed during configure on
  missing X11 headers while the build job passed. One list, one place.

inputs:
  extra-packages:
    description: Additional apt packages to install alongside the base set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libasound2-dev \
          libjack-jackd2-dev \
          libcurl4-openssl-dev \
          libfreetype-dev \
          libfontconfig1-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libglu1-mesa-dev \
          mesa-common-dev \
          libwebkit2gtk-4.1-dev \
          ninja-build \
          ${{ inputs.extra-packages }}
